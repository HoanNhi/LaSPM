# Batch input, output, and mining settings.
dataFolder=dataExperiment/plmsc/
outputFolder=output/
numReruns=4
minDim=0
maxSize=-1
limited=true
writeImageSets=true

# Set ablation=true to write results beneath <outputFolder>/ablation/<mode>/.
ablation=true

# Set exactly one disable_* option to true for a single-heuristic ablation.
# Set every option to false to run the normal configuration.
#Disable local neighborhood pruning
disable_localNeighborhood=false
#Disable dimension aware pruning
disable_dimensionAware=false
#Disable decomposition pruning
disable_decomposition=false
#Disable fast isomorphism test
disable_isomorphism=false
#Disable multiset optimization
disable_multiset=false
#Disable sorting simplices
disable_sorting=false

# Each batch.<name> suffix is the exact dataset filename beneath dataFolder.
# When entries are present, they replace Main_batch's built-in dataset list.
batch.DBLP=300000,400000,500000,600000,700000,755913
batch.OpenAlex=20000,22000,24000,26000,28000
batch.AMiner=900,1000,1100,1200,1300
batch.Walmart=14,16,18,20,22
