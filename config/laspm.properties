# Set ablation=true to write results beneath output/ablation/<mode>/.
ablation=true

# Set exactly one disable_* option to true for a single-heuristic ablation.
# Set every option to false to run the normal configuration.
#Disable local neighborhood pruning
disable_localNeighborhood=false
#Disable dimension aware pruning
disable_dimensionAware=false
#Disable decomposition pruning
disable_decomposition=false
#Disable fast isomorphism test
disable_isomorphism=false
#Disable sorting simplices
disable_sorting=false

# Batch frequency thresholds. Each value is a comma-separated list and
# overrides the corresponding default in LaSPM.Main_batch.
batch.DBLP=180000,190000,200000,210000,220000
batch.OpenAlex=800,1000,1200,1400,1600
batch.AMiner=200,400,600,800,1000
batch.Walmart=5,10,15,20,25
